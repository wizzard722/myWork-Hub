name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Gateway-configuratie controleren
        run: >
          docker run --rm --add-host core:127.0.0.1 --add-host web:127.0.0.1
          -v "$PWD/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          nginx:1.27-alpine nginx -t
      - name: Stack starten en rooktest
        run: |
          docker compose up -d --wait
          curl -fsS http://localhost:8080/api/core/health
          curl -fsS http://localhost:8080/api/core/theme/theme.css | grep -q -- '--mw-color-primary'
          curl -fsS http://localhost:8080/api/core/apps | grep -q '"status":"ok"'
          curl -fsS http://localhost:8080/api/apps/hello/greetings/CI | grep -q 'Hallo CI'
          curl -fsS http://localhost:8080/ | grep -q 'theme.css'
      - if: failure()
        run: docker compose logs
