name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: nginx, dnsmasq en PostgreSQL voor de integratie- en databasetests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nginx dnsmasq-base postgresql
          sudo systemctl stop nginx || true
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kustomize renderen
        run: |
          kubectl kustomize deploy/kubernetes/base > base.yaml
          kubectl kustomize deploy/kubernetes/overlays/production > production.yaml
      - name: Valideren tegen Kubernetes-schema's
        run: >
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/yannh/kubeconform:v0.6.7
          -strict -summary -kubernetes-version 1.31.0 base.yaml production.yaml

  docker:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Images draaien zonder shell en als niet-root
        run: |
          for image in mywork-hub-core:dev mywork-hub-app-hello:dev mywork-hub-gateway:dev mywork-hub-web:dev; do
            user=$(docker image inspect --format '{{.Config.User}}' "$image")
            echo "$image -> user $user"
            test "$user" = "65532"
            if docker run --rm --entrypoint /bin/sh "$image" -c true 2>/dev/null; then
              echo "::error::$image bevat een shell"; exit 1
            fi
          done
      - name: Stack starten en rooktest
        run: |
          docker compose up -d --wait
          curl -fsS http://localhost:8080/api/core/health
          curl -fsS http://localhost:8080/api/core/theme/theme.css | grep -q -- '--mw-color-primary'
          curl -fsS http://localhost:8080/api/core/apps | grep -q '"status":"ok"'
          curl -fsS http://localhost:8080/api/apps/hello/greetings/CI | grep -q 'Hallo CI'
          curl -fsS http://localhost:8080/ | grep -q 'theme.css'
          # Klant aanmaken (container zonder shell: python direct) en inloggen
          docker compose exec -T -e HUB_OWNER_PASSWORD=rooktest-wachtwoord core \
            python -m core.cli create-tenant --slug rooktest --name "Rooktest" \
            --owner-email eigenaar@rooktest.nl --owner-name "Eigenaar"
          curl -fsS -X POST http://localhost:8080/api/core/auth/login \
            -H 'Content-Type: application/json' -H 'Host: rooktest.localhost:8080' \
            -d '{"email":"eigenaar@rooktest.nl","password":"rooktest-wachtwoord"}' | grep -q access_token
          curl -fsS http://localhost:8080/api/core/theme -H 'Host: rooktest.localhost:8080' | grep -q Rooktest
      - if: failure()
        run: docker compose logs
