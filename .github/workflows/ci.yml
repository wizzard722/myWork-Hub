name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: nginx, dnsmasq en PostgreSQL voor de integratie- en databasetests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nginx dnsmasq-base postgresql
          sudo systemctl stop nginx || true
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kustomize renderen
        run: |
          kubectl kustomize deploy/kubernetes/base > base.yaml
          kubectl kustomize deploy/kubernetes/overlays/production > production.yaml
      - name: Valideren tegen Kubernetes-schema's
        run: >
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/yannh/kubeconform:v0.6.7
          -strict -summary -kubernetes-version 1.31.0 base.yaml production.yaml

  docker:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Images draaien zonder shell en apk, als niet-root
        run: |
          for image in mywork-hub-core:dev mywork-hub-app-hello:dev mywork-hub-gateway:dev mywork-hub-web:dev mywork-hub-proxy:dev; do
            user=$(docker image inspect --format '{{.Config.User}}' "$image")
            echo "$image -> user $user"
            test "$user" = "65532:65532"
            for binary in /bin/sh /sbin/apk; do
              if docker run --rm --entrypoint "$binary" "$image" --version >/dev/null 2>&1; then
                echo "::error::$image bevat $binary"; exit 1
              fi
            done
          done
      - name: Stack starten en rooktest (via de reverse proxy, HTTPS)
        run: |
          docker compose up -d --wait
          R="--resolve rooktest.localhost:443:127.0.0.1"
          curl -fsSk https://localhost/api/core/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = "308"
          curl -fsSk -D - -o /dev/null https://localhost/ | grep -qi strict-transport-security
          curl -fsSk https://localhost/api/core/theme/theme.css | grep -q -- '--mw-color-primary'
          curl -fsSk https://localhost/api/core/apps | grep -q '"status":"ok"'
          curl -fsSk https://localhost/api/apps/hello/greetings/CI | grep -q 'Hallo CI'
          curl -fsSk https://localhost/ | grep -q 'theme.css'
          docker compose exec -T -e HUB_OWNER_PASSWORD=rooktest-wachtwoord core \
            python -m core.cli create-tenant --slug rooktest --name "Rooktest" \
            --owner-email eigenaar@rooktest.nl --owner-name "Eigenaar"
          curl -fsSk $R -X POST https://rooktest.localhost/api/core/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"eigenaar@rooktest.nl","password":"rooktest-wachtwoord"}' | grep -q access_token
          curl -fsSk $R https://rooktest.localhost/api/core/theme | grep -q Rooktest
      - name: Netwerkafscherming
        run: |
          ! docker compose exec -T core python -c "import urllib.request;urllib.request.urlopen('https://example.com',timeout=5)"
          ! docker compose exec -T app-hello python -c "import socket;socket.create_connection(('postgres',5432),3)"
          ! nc -z -w2 127.0.0.1 5432
          ! nc -z -w2 127.0.0.1 8080
      - if: failure()
        run: docker compose logs
