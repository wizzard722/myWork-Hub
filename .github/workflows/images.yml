# Bouwt alle container-images op gehardende Chainguard-basisimages, scant ze op
# kwetsbaarheden (Trivy) en publiceert ze naar GitHub Container Registry.
#   - pull requests en andere branches: bouwen + scannen, niet publiceren
#   - main: publiceren met tags "main" en "sha-<commit>"
#   - tag v1.2.3: publiceren met tags "1.2.3", "1.2" en "latest"
name: Images

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: list
        run: echo "images=$(python scripts/images.py list)" >> "$GITHUB_OUTPUT"

  # Geheimen (sleutels, wachtwoorden) zoeken in onze eigen broncode. In images scannen
  # we alleen op kwetsbaarheden: de secret-scanner geeft daar valse meldingen op
  # voorbeelden in bibliotheken van derden.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Geheimen in de repository (Trivy)
        run: >
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.58.1 fs --scanners secret
          --exit-code 1 --no-progress --skip-dirs /repo/web/node_modules /repo

  build:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.images) }}
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Bouwen voor scan
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          build-args: ${{ matrix.image.build_args }}
          load: true
          tags: ${{ matrix.image.name }}:scan
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: Kwetsbaarheden scannen (Trivy)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.58.1 image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed
          --exit-code 1 --no-progress ${{ matrix.image.name }}:scan

      - name: Inloggen bij GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags bepalen
        if: env.PUBLISH == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Publiceren (met SBOM en herkomst)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          build-args: ${{ matrix.image.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image.name }}
