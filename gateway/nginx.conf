# Gateway: interne router van de hub, achter de reverse proxy (Caddy of Ingress).
#   /api/core/...        -> core-service
#   /api/assistant/...   -> assistent-service
#   /api/apps/<id>/...   -> app-service "app-<id>"
#   /                    -> web-schil
# Daarnaast: echte client-IP uit de proxy en rate limiting (o.a. op inloggen).
# Draait als niet-root op een read-only bestandssysteem: alles wat nginx schrijft
# gaat naar /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    default_type application/octet-stream;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Verschilt per omgeving (Docker of Kubernetes): DNS-resolver en
    # $hub_service_suffix. Zie env.conf en de ConfigMap gateway-config.
    include /etc/nginx/hub/env.conf;

    # Echte client-IP: alleen X-Forwarded-For van interne proxy's vertrouwen.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Rate limiting per IP: inloggen/aanmelden streng, overige API ruimer.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    server {
        listen 8080;
        client_max_body_size 100m;
        limit_conn perip 100;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Echte client-IP (na realip) voor het auditlog; services vertrouwen alleen deze.
        proxy_set_header X-Real-IP $remote_addr;

        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ ^/api/core/(auth/login|auth/refresh|signup|me/password)$ {
            limit_req zone=auth burst=5 nodelay;
            set $core_upstream http://core$hub_service_suffix:8000;
            rewrite ^/api/core/(.*)$ /$1 break;
            proxy_pass $core_upstream;
        }

        location /api/core/ {
            limit_req zone=api burst=100 nodelay;
            set $core_upstream http://core$hub_service_suffix:8000;
            rewrite ^/api/core/(.*)$ /$1 break;
            proxy_pass $core_upstream;
        }

        location /api/assistant/ {
            limit_req zone=api burst=20 nodelay;
            set $assistant_upstream http://assistant$hub_service_suffix:8000;
            rewrite ^/api/assistant/(.*)$ /$1 break;
            proxy_pass $assistant_upstream;
            proxy_read_timeout 300s;
        }

        location ~ "^/api/apps/(?<app_id>[a-z][a-z0-9-]{1,38}[a-z0-9])/(?<app_path>.*)$" {
            limit_req zone=api burst=100 nodelay;
            set $app_upstream http://app-$app_id$hub_service_suffix:8000;
            rewrite ^ /$app_path break;
            proxy_pass $app_upstream;
        }

        location /api/ {
            return 404;
        }

        location / {
            set $web_upstream http://web$hub_service_suffix:8080;
            proxy_pass $web_upstream;
        }
    }
}
