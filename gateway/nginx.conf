# Gateway: het enige publieke toegangspunt van de hub.
#   /api/core/...        -> core-service
#   /api/apps/<id>/...   -> app-service "app-<id>"
#   /                    -> web-schil
# Draait als niet-root op een read-only bestandssysteem: alles wat nginx schrijft
# gaat naar /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    default_type application/octet-stream;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Verschilt per omgeving (Docker of Kubernetes): DNS-resolver en
    # $hub_service_suffix. Zie env.conf en de ConfigMap gateway-config.
    include /etc/nginx/hub/env.conf;

    server {
        listen 8080;
        client_max_body_size 100m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/core/ {
            set $core_upstream http://core$hub_service_suffix:8000;
            rewrite ^/api/core/(.*)$ /$1 break;
            proxy_pass $core_upstream;
        }

        location ~ "^/api/apps/(?<app_id>[a-z][a-z0-9-]{1,38}[a-z0-9])/(?<app_path>.*)$" {
            set $app_upstream http://app-$app_id$hub_service_suffix:8000;
            rewrite ^ /$app_path break;
            proxy_pass $app_upstream;
        }

        location /api/ {
            return 404;
        }

        location / {
            set $web_upstream http://web$hub_service_suffix:8080;
            proxy_pass $web_upstream;
        }
    }
}
