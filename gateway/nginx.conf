# Gateway: het enige publieke toegangspunt van de hub.
#   /api/core/...        -> core-service
#   /api/apps/<id>/...   -> app-service "app-<id>"
#   /                    -> web-schil
# Upstreams via variabelen + Docker-DNS, zodat de gateway ook start als een app
# (nog) niet draait; zo'n app geeft dan 502.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    add_header X-Request-ID $request_id always;

    location /api/core/ {
        set $core_upstream http://core:8000;
        rewrite ^/api/core/(.*)$ /$1 break;
        proxy_pass $core_upstream;
    }

    location ~ ^/api/apps/(?<app_id>[a-z][a-z0-9-]{1,38}[a-z0-9])/(?<app_path>.*)$ {
        set $app_upstream http://app-$app_id:8000;
        rewrite ^ /$app_path break;
        proxy_pass $app_upstream;
    }

    location /api/ {
        return 404;
    }

    location / {
        set $web_upstream http://web:80;
        proxy_pass $web_upstream;
    }
}
