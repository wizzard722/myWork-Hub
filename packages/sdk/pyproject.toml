[project]
name = "mywork-sdk"
version = "0.1.0"
description = "Gedeelde bouwstenen voor de myWork-Hub core en apps"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mywork_sdk"]
