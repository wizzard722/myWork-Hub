[project]
name = "mywork-core"
version = "0.1.0"
description = "myWork-Hub core: klanten, gebruikers, app-register en theming"
requires-python = ">=3.12"
dependencies = [
  "mywork-sdk",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
