[project]
name = "mywork-assistant"
version = "0.1.0"
description = "myWork-Hub assistent: LLM die apps bedient binnen de rechten van de gebruiker"
requires-python = ">=3.12"
dependencies = [
  "mywork-sdk",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "anthropic>=0.70",
  "redis>=5.0",
  "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]
