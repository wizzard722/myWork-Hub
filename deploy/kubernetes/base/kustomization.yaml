# Basis voor Kubernetes. Gebruik een overlay (zie ../overlays/production) om
# namespace, image-tags, domeinnaam en aantallen te zetten.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: mywork-hub
    includeSelectors: false
resources:
  - config.yaml
  - gateway.yaml
  - core.yaml
  - app-hello.yaml
  - web.yaml
  - ingress.yaml
