apiVersion: v1
kind: ConfigMap
metadata:
  name: hub-config
data:
  HUB_ENVIRONMENT: production
  # Apps die de core kent: <app-id>=<interne url>. Elke app is een Service "app-<id>".
  HUB_APPS: hello=http://app-hello:8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  NGINX_RESOLVER: kube-dns.kube-system.svc.cluster.local
  # nginx gebruikt geen DNS-zoekdomeinen: volledige naam nodig. Overlay past de
  # namespace aan als die anders is dan "mywork-hub".
  HUB_SERVICE_SUFFIX: .mywork-hub.svc.cluster.local
