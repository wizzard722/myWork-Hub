#!/usr/sbin/nft -f
# Host-firewall voor een myWork-Hub-server (Docker Compose), met nftables.
#
# Toepassen:   sudo nft -f deploy/firewall/nftables.conf
# Controleren: sudo nft -c -f deploy/firewall/nftables.conf
# Blijvend:    kopieer naar /etc/nftables.d/ en zet nftables.service aan.
#
# - Alleen de poorten in @open_tcp / @open_udp zijn van buiten bereikbaar.
# - Gebruikt een eigen tabel; de regels van Docker blijven ongemoeid (geen
#   "flush ruleset").
# - Let op: Docker-poorten lopen via forward/NAT, niet via input. Publiceer daarom in
#   docker-compose alleen de proxy (80/443); alle andere diensten zitten op interne
#   netwerken zonder gepubliceerde poorten (bewaakt door tests/deploy).

table inet mywork_hub
delete table inet mywork_hub

table inet mywork_hub {
	# Pas hier de open poorten aan: 80/443 = de hub (proxy). SSH (22) staat hieronder apart.
	set open_tcp {
		type inet_service
		elements = { 80, 443 }
	}
	set open_udp {
		type inet_service
		elements = { 443 }  # HTTP/3
	}
	# Optioneel: SSH alleen vanaf beheer-adressen (leeg = vanaf overal).
	set ssh_admins_v4 {
		type ipv4_addr
		flags interval
	}

	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop
		iif "lo" accept

		# ICMP/ICMPv6 (nodig voor o.a. MTU-detectie en IPv6), met limiet
		ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
		ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

		# Verkeer van Docker-netwerken naar de host (bijv. DNS van Docker)
		iifname { "docker0", "br-*" } accept

		# SSH: alleen beheer-adressen als de set gevuld is, anders met limiet
		tcp dport 22 ip saddr @ssh_admins_v4 accept
		tcp dport 22 ct state new limit rate 10/minute accept
		tcp dport 22 drop

		tcp dport @open_tcp ct state new accept
		udp dport @open_udp accept

		limit rate 5/minute log prefix "mywork-hub firewall drop: " level info
	}
}
