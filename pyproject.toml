[project]
name = "mywork-hub"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/sdk", "services/core", "apps/hello"]

[tool.uv.sources]
mywork-sdk = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.ruff]
line-length = 100
# Templates bevatten placeholders (__APP_MODULE__); niet automatisch herschrijven.
extend-exclude = ["templates"]
# Alle eigen pakketten (ook nieuwe apps) gelden als first-party voor de importvolgorde.
src = ["packages/*/src", "services/*/src", "apps/*/src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
testpaths = ["packages/sdk/tests", "services/core/tests", "apps/hello/tests", "tests"]
addopts = "--import-mode=importlib"
# Hulpmodules van tests die met import gebruikt worden.
pythonpath = ["services/core/tests"]
