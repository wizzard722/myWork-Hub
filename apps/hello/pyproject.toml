[project]
name = "mywork-app-hello"
version = "0.1.0"
description = "Voorbeeld-app: laat zien hoe een app-service op de hub aansluit"
requires-python = ">=3.12"
dependencies = [
  "mywork-sdk",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello"]
